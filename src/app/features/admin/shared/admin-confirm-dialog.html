<dialog
  #dialog
  class="admin-confirm-dialog"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="admin-confirm-title"
  aria-describedby="admin-confirm-message"
  (cancel)="cancel($event)"
>
  <div class="dialog-stripe" aria-hidden="true"></div>
  <div class="dialog-content">
    <span class="dialog-eyebrow">CONFIRMAÇÃO NECESSÁRIA</span>
    <h2 id="admin-confirm-title">{{ title() }}</h2>
    <p id="admin-confirm-message">{{ message() }}</p>
    <div class="dialog-actions">
      <button class="dialog-cancel" type="button" autofocus (click)="cancel()">Cancelar</button>
      <button class="dialog-confirm" type="button" (click)="confirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
