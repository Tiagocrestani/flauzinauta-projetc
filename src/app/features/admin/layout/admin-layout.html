<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/admin" aria-label="Painel Flauzinauta">
      <span class="brand-mark">F</span>
      <span>FLAUZI<strong>NAUTA</strong><small>Admin</small></span>
    </a>

    <nav aria-label="Navegação administrativa">
      <a
        routerLink="/admin"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span aria-hidden="true">▦</span> Visão geral
      </a>
      <a routerLink="/admin/hqs/nova" routerLinkActive="is-active">
        <span aria-hidden="true">＋</span> Nova HQ
      </a>
      <a routerLink="/" target="_blank"> <span aria-hidden="true">↗</span> Ver site </a>
    </nav>

    <div class="account">
      <small>Conta conectada</small>
      <strong>{{ email() }}</strong>
      <button type="button" (click)="signOut()" [disabled]="signingOut()">
        {{ signingOut() ? 'Saindo...' : 'Sair do painel' }}
      </button>
    </div>
  </aside>

  <section class="admin-content">
    <header class="mobile-header">
      <a routerLink="/admin">Flauzinauta Admin</a>
      <a routerLink="/admin/hqs/nova">+ Nova HQ</a>
    </header>
    <router-outlet />
  </section>
</div>
