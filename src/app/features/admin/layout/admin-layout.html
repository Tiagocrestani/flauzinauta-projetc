<div class="admin-shell">
  <a class="skip-link" href="#admin-content" [attr.inert]="menuOpen() ? '' : null"
    >Pular para o conteúdo do painel</a
  >

  <aside id="admin-sidebar" class="admin-sidebar" [class.is-open]="menuOpen()">
    <button
      class="sidebar-close"
      type="button"
      aria-label="Fechar menu administrativo"
      (click)="closeMenu()"
    >
      <span aria-hidden="true">×</span>
    </button>
    <a
      class="admin-brand"
      routerLink="/admin"
      (click)="closeMenu()"
      aria-label="Flauzinauta, início do painel"
    >
      <span class="admin-brand-mark" aria-hidden="true">F<span>★</span></span>
      <span>
        <strong>FLAUZINAUTA</strong>
        <small>PAINEL EDITORIAL</small>
      </span>
    </a>

    <nav class="admin-nav" aria-label="Navegação administrativa">
      <p class="nav-group-label">ESPAÇO DE CRIAÇÃO</p>
      <a
        #firstMenuItem
        routerLink="/admin"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <span class="nav-icon" aria-hidden="true">◈</span>
        <span>Visão geral</span>
      </a>
      <a
        routerLink="/admin/hqs"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span>HQs e edições</span>
      </a>
      <a class="nav-create" routerLink="/admin/hqs/nova" (click)="closeMenu()">
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>Nova HQ</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <p>Histórias incríveis começam por aqui.</p>
      <a routerLink="/" (click)="closeMenu()">← Voltar ao site</a>
    </div>
  </aside>

  @if (menuOpen()) {
    <button
      class="mobile-scrim"
      type="button"
      aria-label="Fechar menu administrativo"
      (click)="closeMenu()"
    ></button>
  }

  <div class="admin-workspace" [attr.inert]="menuOpen() ? '' : null">
    <header class="admin-topbar">
      <div class="topbar-start">
        <button
          #menuToggle
          class="menu-toggle"
          type="button"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
          (click)="toggleMenu()"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <div>
          <span class="topbar-eyebrow">FLAUZINAUTA / ADMIN</span>
          <strong>Estúdio de HQs</strong>
        </div>
      </div>
      <a class="topbar-site-link" routerLink="/">Ver site <span aria-hidden="true">↗</span></a>
    </header>

    <main id="admin-content" class="admin-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
